name: CollectPin Telegram

# Автопостинг газеты в канал. Код — telegram.py, описание — в его начале.
# Своё расписание, отдельно от скаута: сбой одного не мешает другому.

on:
  schedule:
    # Каждые полчаса, в :03 и :33 (время в cron — по Гринвичу).
    # Ночью (01:00–08:00 по Москве) скрипт сам ничего не публикует.
    - cron: '3,33 * * * *'

  # Ручной запуск: Actions → CollectPin Telegram → Run workflow
  workflow_dispatch:
    inputs:
      rezhim:
        description: 'Что сделать'
        required: true
        default: 'proverka'
        type: choice
        options:
          - proverka    # ничего не публикует: проверяет бота, канал и лист gazeta
          - obychnyy    # обычная работа: опубликовать новые одобренные новости

permissions:
  contents: write

concurrency:
  group: collectpin-telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Post news
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL:   ${{ secrets.TG_CHANNEL }}
          MODE: ${{ github.event.inputs.rezhim || 'obychnyy' }}
        run: python telegram.py

      - name: Save posted log
        # Скаут пишет в тот же репозиторий, поэтому перед отправкой
        # подтягиваем его свежие коммиты и пробуем до трёх раз.
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f tg_posted.json ]; then git add tg_posted.json; fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update Telegram posted log"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 7
          done
          exit 1
