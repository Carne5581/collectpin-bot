name: Run CollectPin Scanner

on:
  schedule:
    # Расписание переключается само, править ничего не нужно.
    # Время в cron — по Гринвичу (UTC), Москва на 3 часа впереди.
    # Минуты :07, :22, :37, :52 вместо :00 и :15 — в «круглые» минуты
    # GitHub перегружен и задерживает запуски на часы.
    #
    # 1–11 ноября: раз в 6 часов — ищем громкие новости до релиза.
    - cron: '7 */6 1-11 11 *'
    # 12 ноября — 31 декабря: каждые 15 минут. Предзагрузка, релиз,
    # первые находки. ВАЖНО: такой частоте нужен ПУБЛИЧНЫЙ репозиторий,
    # у приватного бесплатные минуты кончатся примерно за неделю.
    - cron: '7,22,37,52 * 12-30 11 *'
    - cron: '7,22,37,52 * * 12 *'
    # С января: раз в час.
    - cron: '7 * * 1-10 *'

  # Кнопка ручного запуска с выбором режима.
  # Actions → Run CollectPin Scanner → Run workflow → выбрать режим.
  workflow_dispatch:
    inputs:
      rezhim:
        description: 'Что сделать'
        required: true
        default: 'obychnyy'
        type: choice
        options:
          - obychnyy    # обычная работа: находки + новости
          - novosti     # только новости для газеты
          - proverka    # только проверить источники, ничего не менять
          - test        # отправить по одной тестовой строке в sbor_ai и gazeta

permissions:
  contents: write

concurrency:
  group: collectpin-scanner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests groq feedparser

      - name: Run Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WEBHOOK_URL:  ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_KEY:  ${{ secrets.WEBHOOK_KEY }}
          NEWS_WEBHOOK_URL: ${{ secrets.NEWS_WEBHOOK_URL }}
          NEWS_WEBHOOK_KEY: ${{ secrets.NEWS_WEBHOOK_KEY }}
          # По расписанию режим всегда обычный.
          # При ручном запуске берётся тот, что выбран в списке.
          MODE: ${{ github.event.inputs.rezhim || 'obychnyy' }}
        run: python bot.py

      - name: Save seen posts log
        # Сохраняем всегда, даже если бот покраснел: отчёт в README.md
        # нужен именно тогда, когда что-то сломалось. Если бот решил
        # не сохранять прочитанное (Таблица не приняла находки),
        # seen_posts.json просто не изменится.
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          for f in seen_posts.json README.md news_seen.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --staged --quiet || (git commit -m "Update seen posts log" && git push)
