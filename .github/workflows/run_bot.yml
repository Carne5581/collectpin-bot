name: Run CollectPin Scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write 

# ЗАЩИТА ОТ ПАРАЛЛЕЛЬНЫХ ЗАПУСКОВ (Совет ChatGPT)
concurrency:
  group: collectpin-scanner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # ОБНОВИЛИ ДО 3.12 (Броня на 2026-2027 годы)
          
      - name: Install dependencies
        run: pip install requests groq feedparser
        
      - name: Run Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python bot.py
        
      - name: Save seen posts log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen posts log" && git push)
