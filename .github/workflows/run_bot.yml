name: Run CollectPin Scanner

on:
  schedule:
    # РАЗ В СУТКИ, 09:00 по Москве (06:00 UTC).
    #
    # Раньше стояло '*/15 * * * *' — каждые 15 минут, 96 запусков
    # в сутки. У приватного репозитория бесплатные минуты не
    # бесконечны, а до релиза игры четыре месяца холостого хода.
    #
    # 12 НОЯБРЯ поменяй строку ниже на:
    #     - cron: '*/15 * * * *'
    # Это единственная правка, которая понадобится к релизу.
    - cron: '0 6 * * *'

  # Кнопка ручного запуска с выбором режима.
  # Actions → Run CollectPin Scanner → Run workflow → выбрать режим.
  workflow_dispatch:
    inputs:
      rezhim:
        description: 'Что сделать'
        required: true
        default: 'obychnyy'
        type: choice
        options:
          - obychnyy    # обычная работа: читать источники, слать в Таблицу
          - proverka    # только проверить источники, ничего не менять
          - test        # отправить в Таблицу одну тестовую строку

permissions:
  contents: write

concurrency:
  group: collectpin-scanner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests groq feedparser

      - name: Run Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WEBHOOK_URL:  ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_KEY:  ${{ secrets.WEBHOOK_KEY }}
          # По расписанию режим всегда обычный.
          # При ручном запуске берётся тот, что выбран в списке.
          MODE: ${{ github.event.inputs.rezhim || 'obychnyy' }}
        run: python bot.py

      - name: Save seen posts log
        # В режимах proverka и test список прочитанного не меняется,
        # поэтому коммита не будет — git сам увидит, что нечего сохранять.
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen posts log" && git push)
